# Publica a vitrine da demonstração no GitHub Pages a cada push na main.
# Antes do primeiro deploy: Settings > Pages > Source: "GitHub Actions".
name: Publicar demonstração

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Exporta o app e monta a vitrine
        run: npm run build:pages
        env:
          # O site fica em https://<usuario>.github.io/<repositorio>/ e o app em .../app
          EXPO_BASE_URL: /${{ github.event.repository.name }}/app

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
